name: Development build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake ldid dpkg wget make

      - name: Get JRE 8
        run: |
          mkdir -p JavaApp/src/main/resources/runtimes/8
          wget -q https://github.com -O jre8.tar.xz
          tar -xf jre8.tar.xz -C JavaApp/src/main/resources/runtimes/8
          rm jre8.tar.xz

      - name: Get JRE 17
        run: |
          mkdir -p JavaApp/src/main/resources/runtimes/17
          wget -q https://github.com -O jre17.tar.xz
          tar -xf jre17.tar.xz -C JavaApp/src/main/resources/runtimes/17
          rm jre17.tar.xz

      - name: Build IPA
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make -j$(sysctl -n hw.ncpu) package_ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-iOS-IPA
          path: build/*.ipa
