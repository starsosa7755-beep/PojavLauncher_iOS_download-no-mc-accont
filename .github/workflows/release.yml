name: Release build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.platform_name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: iOS (TrollStore / Sideload)
            build_target: package_ipa
            artifact_path: build/*.ipa
          - platform_name: iOS (Jailbreak)
            build_target: package_deb
            artifact_path: build/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install cmake ldid dpkg wget make

      - name: Get JRE 8
        run: |
          mkdir -p JavaApp/src/main/resources/runtimes/8
          wget -q "PUT_DIRECT_JRE_8_URL_HERE" -O jre8.tar.xz
          tar -xf jre8.tar.xz -C JavaApp/src/main/resources/runtimes/8
          rm jre8.tar.xz

      - name: Get JRE 17
        run: |
          mkdir -p JavaApp/src/main/resources/runtimes/17
          wget -q "PUT_DIRECT_JRE_17_URL_HERE" -O jre17.tar.xz
          tar -xf jre17.tar.xz -C JavaApp/src/main/resources/runtimes/17
          rm jre17.tar.xz

      - name: Get JRE 21
        run: |
          mkdir -p JavaApp/src/main/resources/runtimes/21
          wget -q "PUT_DIRECT_JRE_21_URL_HERE" -O jre21.tar.xz
          tar -xf jre21.tar.xz -C JavaApp/src/main/resources/runtimes/21
          rm jre21.tar.xz

      - name: Build PojavLauncher
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make -j$(sysctl -n hw.ncpu) ${{ matrix.build_target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-${{ matrix.build_target }}
          path: ${{ matrix.artifact_path }}
